name: Build LIME HD Offline Custom Push

on:
  push:
    branches:
      - chatgpt-limehd-offline-build-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Clone official LIME v6.1.38
        shell: bash
        run: |
          git clone --depth 1 --branch v6.1.38 https://github.com/lime-ime/limeime.git "$RUNNER_TEMP/limeime"
          git -C "$RUNNER_TEMP/limeime" rev-parse HEAD | tee "$RUNNER_TEMP/upstream-commit.txt"

      - name: Decode local audited patches
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lime-patches"
          base64 -d lime-build/apply_character_chain.py.gz.b64 | gzip -dc > "$RUNNER_TEMP/lime-patches/apply_character_chain.py"
          base64 -d lime-build/apply_boshiamy_lookup.py.gz.b64 | gzip -dc > "$RUNNER_TEMP/lime-patches/apply_boshiamy_lookup.py"
          base64 -d lime-build/apply_offline_hardening.py.gz.b64 | gzip -dc > "$RUNNER_TEMP/lime-patches/apply_offline_hardening.py"
          python3 -m py_compile "$RUNNER_TEMP"/lime-patches/*.py

      - name: Normalize official v6.1.38 patch anchors
        shell: bash
        env:
          LIME_ROOT: ${{ runner.temp }}/limeime
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["LIME_ROOT"]) / "LimeStudio/app/src/main/java/org/limeime/SearchServer.java"
          s = p.read_text(encoding="utf-8")
          replacements = [
              (
                  "    private static List<Mapping> scorelist = Collections.synchronizedList(new ArrayList<>());\n\n    //Jeremy '15,6,2 preserve the exact match mapping with the code user typed.\n",
                  "    private static List<Mapping> scorelist = Collections.synchronizedList(new ArrayList<>());\n    //Jeremy '15,6,2 preserve the exact match mapping with the code user typed.\n",
                  "scorelist"
              ),
              (
                  "    public void postFinishInput() throws RemoteException {\n\n        if (scorelistSnapshot == null) scorelistSnapshot = new LinkedList<>();\n",
                  "    public void postFinishInput() throws RemoteException {\n        if (scorelistSnapshot == null) scorelistSnapshot = new LinkedList<>();\n",
                  "postFinishInput"
              ),
              (
                  "                            int score;\n\n                            //if (unit.getId() != null && unit2.getId() != null)",
                  "                            int score;\n                            //if (unit.getId() != null && unit2.getId() != null)",
                  "deferred related learning"
              ),
          ]
          for old, new, label in replacements:
              if old not in s:
                  raise SystemExit(f"Expected v6.1.38 whitespace anchor not found: {label}")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          q = Path(os.environ["LIME_ROOT"]) / "LimeStudio/app/src/main/java/org/limeime/LIMEService.java"
          t = q.read_text(encoding="utf-8")
          old = '    public void onFinishInput() {\n\n        if (DEBUG) {\n            Log.i(TAG, "onFinishInput()");\n        }\n'
          new = '    public void onFinishInput() {\n        if (DEBUG) {\n            Log.i(TAG, "onFinishInput()");\n        }\n'
          if old not in t:
              raise SystemExit("Expected v6.1.38 LIMEService whitespace anchor not found: onFinishInput")
          q.write_text(t.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply feature and privacy patches
        shell: bash
        run: |
          cp "$RUNNER_TEMP/limeime/LimeStudio/app/src/main/AndroidManifest.xml" "$RUNNER_TEMP/original-AndroidManifest.xml"
          cp "$RUNNER_TEMP/limeime/LimeStudio/app/src/main/java/org/limeime/LIMEService.java" "$RUNNER_TEMP/original-LIMEService.java"

          python3 "$RUNNER_TEMP/lime-patches/apply_character_chain.py" "$RUNNER_TEMP/limeime"
          python3 "$RUNNER_TEMP/lime-patches/apply_boshiamy_lookup.py" "$RUNNER_TEMP/limeime"
          python3 "$RUNNER_TEMP/lime-patches/apply_offline_hardening.py" "$RUNNER_TEMP/limeime"

          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          service = root / "limeime/LimeStudio/app/src/main/java/org/limeime/LIMEService.java"
          current = service.read_text(encoding="utf-8")
          original = (root / "original-LIMEService.java").read_text(encoding="utf-8")

          old = "primaryCode == MY_KEYCODE_SPACE || primaryCode == MY_KEYCODE_DELETE"
          new = "primaryCode == MY_KEYCODE_SPACE || primaryCode == LIMEBaseKeyboard.KEYCODE_DELETE"
          if current.count(old) != 1:
              raise SystemExit(f"Expected exactly one legacy delete-key symbol, found {current.count(old)}")
          current = current.replace(old, new, 1)

          def method_span(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f"Missing method: {signature}")
              brace = text.find("{", start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise SystemExit(f"Unclosed method: {signature}")

          oa, ob = method_span(original, "public void startVoiceInput()")
          ca, cb = method_span(current, "public void startVoiceInput()")
          current = current[:ca] + original[oa:ob] + current[cb:]
          service.write_text(current, encoding="utf-8")

          manifest = root / "limeime/LimeStudio/app/src/main/AndroidManifest.xml"
          m = (root / "original-AndroidManifest.xml").read_text(encoding="utf-8")
          m = m.replace(
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.INTERNET" tools:node="remove" />')
          m = m.replace(
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" tools:node="remove" />')
          m = m.replace('android:allowBackup="true"', 'android:allowBackup="false"')
          m = m.replace('        android:backupAgent=".LIMEBackupAgent"\n', '')
          if 'android:usesCleartextTraffic=' not in m:
              m = m.replace(
                  '        android:label="@string/app_name"\n',
                  '        android:label="@string/app_name"\n        android:usesCleartextTraffic="false"\n',
                  1)
          manifest.write_text(m, encoding="utf-8")
          PY

      - name: Static privacy gates before build
        shell: bash
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/limeime/LimeStudio/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.INTERNET.*tools:node="remove"' "$M"
          grep -q 'android.permission.ACCESS_NETWORK_STATE.*tools:node="remove"' "$M"
          grep -q 'android.permission.RECORD_AUDIO' "$M"
          ! grep -q 'android.permission.RECORD_AUDIO.*tools:node="remove"' "$M"
          grep -q 'android:allowBackup="false"' "$M"
          grep -q 'android:usesCleartextTraffic="false"' "$M"
          grep -q 'VoiceInputActivity' "$M"
          grep -q 'android.speech.action.RECOGNIZE_SPEECH' "$M"
          ! grep -q '安全離線版已停用語音輸入' "$RUNNER_TEMP/limeime/LimeStudio/app/src/main/java/org/limeime/LIMEService.java"
          grep -q 'setJavaScriptEnabled(false)' "$RUNNER_TEMP/limeime/LimeStudio/app/src/main/java/org/limeime/ui/dialog/NewsDialog.java"
          grep -q 'setBlockNetworkLoads(true)' "$RUNNER_TEMP/limeime/LimeStudio/app/src/main/java/org/limeime/ui/dialog/NewsDialog.java"
          grep -q 'Network disabled in LIME HD Offline Custom build' "$RUNNER_TEMP/limeime/LimeStudio/app/src/main/java/org/limeime/global/LIMEUtilities.java"

      - name: Generate ephemeral release signing key
        shell: bash
        run: |
          set -euo pipefail
          STOREPASS="$(openssl rand -hex 24)"
          KEYPASS="$STOREPASS"
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/lime-offline.jks"             -storepass "$STOREPASS"             -keypass "$KEYPASS"             -alias limeoffline             -keyalg RSA -keysize 3072 -validity 3650             -dname "CN=LIME HD Offline Custom,O=Local Privacy Build,C=TW"
          cat > "$RUNNER_TEMP/limeime/LimeStudio/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/lime-offline.jks
          storePassword=$STOREPASS
          keyAlias=limeoffline
          keyPassword=$KEYPASS
          EOF

      - name: Run unit tests
        shell: bash
        working-directory: ${{ runner.temp }}/limeime/LimeStudio
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Build signed release APK
        shell: bash
        working-directory: ${{ runner.temp }}/limeime/LimeStudio
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Verify final APK permissions and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$RUNNER_TEMP/limeime/LimeStudio/app/build/outputs/apk/release" -name '*.apk' -type f | head -1)"
          test -n "$APK"
          mkdir -p "$RUNNER_TEMP/output"
          cp "$APK" "$RUNNER_TEMP/output/LIMEHD-v6.1.38-offline-custom1.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$BUILD_TOOLS/aapt2" dump permissions "$RUNNER_TEMP/output/LIMEHD-v6.1.38-offline-custom1.apk" | tee "$RUNNER_TEMP/output/permissions.txt"
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' "$RUNNER_TEMP/output/permissions.txt"; then
            echo "FAIL: forbidden network permission present in final APK"
            exit 1
          fi
          if ! grep -q 'android.permission.RECORD_AUDIO' "$RUNNER_TEMP/output/permissions.txt"; then
            echo "FAIL: RECORD_AUDIO missing; voice input would be disabled"
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/output/LIMEHD-v6.1.38-offline-custom1.apk" | tee "$RUNNER_TEMP/output/signature.txt"
          sha256sum "$RUNNER_TEMP/output/LIMEHD-v6.1.38-offline-custom1.apk" | tee "$RUNNER_TEMP/output/SHA256SUMS.txt"

      - name: Create audit report
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/output/SECURITY_AUDIT.txt" <<'EOF'
          LIME HD v6.1.38 Offline Custom - security build gates
          =====================================================
          Base: official lime-ime/limeime tag v6.1.38
          Runtime package: org.limeime.offlinecustom
          Runtime label: LIME HD 安全離線版

          Privacy hardening:
          - INTERNET removed and manifest merger forced to remove it.
          - ACCESS_NETWORK_STATE removed and manifest merger forced to remove it.
          - RECORD_AUDIO preserved for voice input.
          - Android cloud backup disabled (allowBackup=false).
          - Official voice-input route preserved; system/vendor speech service may use network independently.
          - Remote table downloader hard-disabled in code.
          - Network availability path hard-disabled.
          - News WebView JavaScript disabled and network loads blocked.
          - Cleartext traffic disabled.
          - Final APK permission dump must contain neither INTERNET nor ACCESS_NETWORK_STATE.
          - Final APK permission dump must contain RECORD_AUDIO.

          Feature changes:
          - Immediate Han character-chain learning in addition to modern phrase learning.
          - Idle custom/Boshiamy '.' enters one-shot phonetic lookup and shows phonetic keyboard.
          - Immediate '. + Space' still commits the Chinese full stop '。'.
          - After phonetic selection, keyboard returns to custom/Boshiamy.
          - First Space after lookup displays the selected word's custom-table code and does not insert a space.
          - Lookup selection does not contaminate related-phrase sentence learning.

          Static source review also found no Runtime.exec/ProcessBuilder/DexClassLoader/
          PathClassLoader/addJavascriptInterface/Firebase/Crashlytics/Analytics/Socket
          or clipboard-read API in the reviewed Android production source searches.
          EOF
          printf '\nUpstream commit: ' >> "$RUNNER_TEMP/output/SECURITY_AUDIT.txt"
          cat "$RUNNER_TEMP/upstream-commit.txt" >> "$RUNNER_TEMP/output/SECURITY_AUDIT.txt"

      - name: Upload APK and audit
        uses: actions/upload-artifact@v4
        with:
          name: LIMEHD-v6.1.38-offline-custom1
          path: ${{ runner.temp }}/output/*
          if-no-files-found: error
          retention-days: 7
